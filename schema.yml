      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UserDetails:
      type: object
      description: |-
        Read-only serializer for the authenticated user's core info.
        Used by dj-rest-auth's `/user/` endpoint and JWT payload.
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_email_verified:
          type: boolean
          readOnly: true
        push_notifications_enabled:
          type: boolean
        subscription_tier:
          $ref: '#/components/schemas/SubscriptionTierEnum'
      required:
      - email
      - first_name
      - full_name
      - id
      - is_email_verified
      - last_name
    UserMe:
      type: object
      description: Serializer for the GET /me/ endpoint. Includes nested profiles
        and stats.
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_email_verified:
          type: boolean
          readOnly: true
        push_notifications_enabled:
          type: boolean
        subscription_tier:
          $ref: '#/components/schemas/SubscriptionTierEnum'
        profile:
          type: string
          readOnly: true
        stats:
          type: string
          readOnly: true
      required:
      - email
      - first_name
      - id
      - is_email_verified
      - last_name
      - profile
      - stats
    VerificationStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      type: string
      description: |-
        * `PENDING` - Pending
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
    VerifyOTPRequest:
      type: object
      description: Validates the fields needed to verify an OTP code.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        code:
          type: string
          minLength: 6
          maxLength: 6
      required:
      - code
      - email
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
