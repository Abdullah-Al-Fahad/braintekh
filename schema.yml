          description: One-line pitch
          maxLength: 120
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          readOnly: true
        industry:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/Status19aEnum'
        funding_goal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Total amount to raise
        funding_stage:
          type: string
          description: e.g. Seed, Series A
          maxLength: 100
        raised_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        minimum_investment:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Minimum Investment Amount (MIA)
        target_roi:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Target ROI percentage (e.g., 18.00 for 18%)
        potential_monthly_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        hold_period_months:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Hold period in months
        timeline_to_operations_months:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Timeline to operations in months
        timeline_months:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Overall project timeline in months
        cover_image:
          type: string
          format: uri
          nullable: true
        sponsor:
          type: string
          readOnly: true
        is_saved:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - categories
      - created_at
      - funding_goal
      - id
      - is_saved
      - location
      - minimum_investment
      - short_description
      - sponsor
      - target_roi
      - timeline_months
      - title
    ProjectTeamMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        role:
          type: string
          maxLength: 255
      required:
      - id
      - name
      - role
    RegisterRequest:
      type: object
      description: Validates and creates a new user account.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          title: Email address
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - first_name
      - last_name
      - password
    ResendOTPRequest:
      type: object
      description: Validates the email for which to resend an OTP.
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    ResetPasswordRequest:
      type: object
      description: Validates the OTP and new password for a password reset.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        code:
          type: string
          minLength: 6
          maxLength: 6
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - code
      - email
      - new_password
    RestAuthDetail:
      type: object
      properties:
        detail:
          type: string
          readOnly: true
      required:
      - detail
    RoleEnum:
      enum:
      - SPONSOR
      - INVESTOR
      - NONE
      type: string
      description: |-
        * `SPONSOR` - Sponsor
        * `INVESTOR` - Investor
        * `NONE` - None
    SponsorProfile:
      type: object
      description: |-
        Full read/write serializer for the SponsorProfile.

        Documents are embedded as read-only nested objects.
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
          readOnly: true
        legal_company_name:
          type: string
          maxLength: 255
        registration_number:
          type: string
          maxLength: 100
        business_address:
          type: string
        company_website:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 100
        location:
          type: string
          maxLength: 255
        position_title:
          type: string
          maxLength: 255
        bio:
          type: string
        profile_photo:
          type: string
          format: uri
          nullable: true
        verification_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - documents
      - email
      - id
      - updated_at
      - verification_status
    Status19aEnum:
      enum:
      - DRAFT
      - ACTIVE
      - FUNDED
      - COMPLETED
      - TERMINATED
      - CANCELLED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `ACTIVE` - Active
        * `FUNDED` - Funded
        * `COMPLETED` - Completed
        * `TERMINATED` - Terminated
        * `CANCELLED` - Cancelled
    SubscriptionTierEnum:
      enum:
      - FREE
      - PRO
      type: string
      description: |-
        * `FREE` - Free
        * `PRO` - Pro
    TokenRefresh:
      type: object
      properties:
